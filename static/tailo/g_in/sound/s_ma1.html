<script>
var TL_SND = "../../voice/", TL_HAVE = {};
function setFileName(f) {
  var a = document.getElementById("tl-audio"); if (!a) return;

  a.src = TL_SND + f; a.play().catch(function () {});
}
function tlNote(msg) {
  var n = document.getElementById("tl-note");
  if (!n) { n = document.createElement("div"); n.id = "tl-note"; document.body.appendChild(n); }
  n.textContent = msg; n.style.display = "block"; clearTimeout(n._t); n._t = setTimeout(function () { n.style.display = "none"; }, 2600);
}
