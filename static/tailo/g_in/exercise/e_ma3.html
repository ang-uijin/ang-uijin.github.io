<script>
var TL_SND = "../../voice/", TL_HAVE = {};
function setFileName(f) {
  var a = document.getElementById("tl-audio"); if (!a) return;
  if (!TL_HAVE[f.toLowerCase()]) { tlNote("這個音檔 Wayback 沒有存到，已佚失（" + f + "）"); return; }
  a.src = TL_SND + f; a.play().catch(function () {});
}
function tlNote(msg) {
  var n = document.getElementById("tl-note");
  if (!n) { n = document.createElement("div"); n.id = "tl-note"; document.body.appendChild(n); }
  n.textContent = msg; n.style.display = "block"; clearTimeout(n._t); n._t = setTimeout(function () { n.style.display = "none"; }, 2600);
}
</script>
<style>
#tl-note{display:none;position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#5a3a1a;color:#fff;padding:6px 14px;border-radius:4px;font-size:13px;z-index:99;white-space:nowrap}
[onclick*="setFileName"]{cursor:pointer}
.snd-ok{text-decoration:underline dotted #a0522d;text-underline-offset:3px}
.snd-missing{cursor:default!important;text-decoration:none}
img.snd-missing{opacity:.35}
