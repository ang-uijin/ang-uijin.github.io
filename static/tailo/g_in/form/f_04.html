function setFileName(f) {
  var a = document.getElementById("tl-audio"); if (!a) return;

}
function tlNote(msg) {
  var n = document.getElementById("tl-note");
  if (!n) { n = document.createElement("div"); n.id = "tl-note"; document.body.appendChild(n); }

}

<script>
/* 自動適配螢幕寬度（2026 年加的）：寬的框裡整頁等比放大（最多 1.35 倍）、置中；窄的框裡排過還放不下就整頁等比縮小 */
(function () {
  var ZMAX = 1.35;
  function fit() {
    var b = document.body; if (!b) return;
    var se = document.scrollingElement || document.documentElement;
    b.style.zoom = ""; b.style.marginLeft = b.style.marginRight = "";
    var vw = se.clientWidth, w = se.scrollWidth > vw + 1 ? se.scrollWidth : 0;
    var narrow = window.matchMedia && matchMedia("(max-width:600px)").matches;
    var t = b.querySelector("table"), natural = t ? t.offsetWidth + 16 : vw;
    if (!narrow) {
      var z = Math.min(ZMAX, vw / Math.max(natural, w));
      if (z > 1.02) { b.style.zoom = z.toFixed(3); b.style.marginLeft = b.style.marginRight = "auto"; if (t) t.style.marginLeft = t.style.marginRight = "auto"; }
    }
    for (var k = 0; k < 3 && se.scrollWidth > se.clientWidth + 1; k++)   // 縮一次可能因為進位還多 1–3px，最多再修兩次
      b.style.zoom = ((parseFloat(b.style.zoom) || 1) * se.clientWidth / se.scrollWidth * 0.995).toFixed(3);
  }
  function run() { fit(); requestAnimationFrame(fit); }
  if (document.readyState === "complete") run(); else addEventListener("load", run);
  addEventListener("resize", run);
})();
</script>
