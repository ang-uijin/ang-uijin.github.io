<script>
(function () {
  function boot() {
    var api = window.RufflePlayer && window.RufflePlayer.newest && window.RufflePlayer.newest();
    if (!api) { document.querySelectorAll(".rf-swf").forEach(function (el) { el.title = "Ruffle 載入失敗"; }); return; }
    document.querySelectorAll(".rf-swf[data-swf]").forEach(function (el) {
      var p = api.createPlayer();
      p.style.display = "block";
      if (el.getAttribute("data-fill")) { p.style.position = "absolute"; p.style.inset = "0"; p.style.width = "100%"; p.style.height = "100%"; }
      else { p.style.width = el.style.width; p.style.height = el.style.height; }
      el.appendChild(p);
      p.ruffle().load({ url: el.getAttribute("data-swf"), wmode: el.getAttribute("data-wmode") || "window" });
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
