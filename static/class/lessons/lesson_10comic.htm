<script>
window.RufflePlayer = window.RufflePlayer || {};
window.RufflePlayer.config = {
  publicPath: "/ruffle/", polyfills: false, autoplay: "on", unmuteOverlay: "hidden",
  splashScreen: false, letterbox: "off", scale: "showAll", warnOnUnsupportedContent: false,
  showSwfDownload: false, allowScriptAccess: false
};
</script>
<script src="/ruffle/ruffle.js"></script>
<script>
(function () {
  function boot() {
    var api = window.RufflePlayer && window.RufflePlayer.newest && window.RufflePlayer.newest();
    if (!api) { document.querySelectorAll(".rf-swf").forEach(function (el) { el.title = "Ruffle 載入失敗"; }); return; }
    document.querySelectorAll(".rf-swf[data-swf]").forEach(function (el) {
      if (!el.getAttribute("data-swf")) return;
      var p = api.createPlayer();
      p.style.width = el.style.width; p.style.height = el.style.height; p.style.display = "block";
      el.appendChild(p);
      var cfg = { url: el.getAttribute("data-swf"), wmode: el.getAttribute("data-wmode") || "window" };
      if (el.getAttribute("data-renderer")) cfg.preferredRenderer = el.getAttribute("data-renderer");  // 音鈕用 canvas，避開 WebGL context 上限
      p.ruffle().load(cfg);
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
<script>
/* 自動適配螢幕寬度（2026 年加的）：.zz-stage 跟著框寬等比縮放（最多 1.6 倍）；手機上書本改排時改縮 .zz-fit；
   縮完還比框寬的頁（或根本沒有這兩種的頁），整頁等比縮小 */
(function () {
  var ZMAX = 1.6;
  function avail(el) {
    var p = el.parentNode, cs = getComputedStyle(p), b = document.body, se = document.scrollingElement || document.documentElement;
    var w = p.getBoundingClientRect().width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    if (p === b) w = Math.min(w, se.clientWidth - parseFloat(cs.marginLeft) - parseFloat(cs.marginRight));
    return w;
  }
  function zoomTo(el, max) {
    el.style.zoom = "";
    var z = Math.min(max, avail(el) / el.offsetWidth);
    if (Math.abs(z - 1) > 0.02) el.style.zoom = z.toFixed(3);
  }
  function fit() {
    var b = document.body; if (!b) return;
    var se = document.scrollingElement || document.documentElement, i;
    var narrow = window.matchMedia && matchMedia("(max-width:600px)").matches;
    var st = document.querySelectorAll(".zz-stage"), fits = document.querySelectorAll(".zz-fit");
    for (i = 0; i < st.length; i++) {
      if (narrow && st[i].className.indexOf("zz-book") >= 0) st[i].style.zoom = "";
      else zoomTo(st[i], ZMAX);
    }
    for (i = 0; i < fits.length; i++) {
      if (narrow) zoomTo(fits[i], 1); else fits[i].style.zoom = "";
    }
    b.style.zoom = "";                       // 縮放過還是比框寬（例如首頁的拼圖在別的表格裡），整頁再等比縮小
    for (var k = 0; k < 3 && se.scrollWidth > se.clientWidth + 1; k++)
      b.style.zoom = ((parseFloat(b.style.zoom) || 1) * se.clientWidth / se.scrollWidth * 0.995).toFixed(3);
  }
  function run() { fit(); requestAnimationFrame(fit); }
  if (document.readyState === "complete") run(); else addEventListener("load", run);
  addEventListener("resize", run);
})();
</script>
