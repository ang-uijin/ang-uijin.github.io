window.RufflePlayer.config = {
  publicPath: "/ruffle/", polyfills: false, autoplay: "on", unmuteOverlay: "hidden",

};

<script src="/ruffle/ruffle.js"></script>
<script>
(function () {
  function boot() {
    var api = window.RufflePlayer && window.RufflePlayer.newest && window.RufflePlayer.newest();
    if (!api) { document.querySelectorAll(".rf-swf").forEach(function (el) { el.title = "Ruffle 載入失敗"; }); return; }
    document.querySelectorAll(".rf-swf[data-swf]").forEach(function (el) {
      if (!el.getAttribute("data-swf")) return;
      var p = api.createPlayer();
      p.style.width = el.style.width; p.style.height = el.style.height; p.style.display = "block";
      el.appendChild(p);
      var cfg = { url: el.getAttribute("data-swf"), wmode: el.getAttribute("data-wmode") || "window" };
      if (el.getAttribute("data-renderer")) cfg.preferredRenderer = el.getAttribute("data-renderer");  // 音鈕用 canvas，避開 WebGL context 上限
      p.ruffle().load(cfg);
    });
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot); else boot();
})();
</script>
