backend:
  name: github
  repo: ang-uijin/ang-uijin.github.io
  branch: main
  base_url: https://sveltia-cms-auth.tesiniong.workers.dev

# 檔名最長 60 字（Actions 的 Linux 檔名上限 255 bytes，中文一字 3 bytes）
slug: {maxlength: 60}

media_folder: "static/images"
public_folder: "/images"

collections:
  # ===== 最新動態：一篇一檔 =====
  - name: "news"
    label: "最新動態"
    label_singular: "動態"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    media_folder: "/static/files/news"
    public_folder: "/files/news"
    sortable_fields: ["date", "title"]
    fields:
      - {label: "標題", name: "title", widget: "string"}
      - {label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
      - {label: "出處（可不填）", name: "source", widget: "string", required: false}
      - {label: "原始連結（可不填）", name: "link", widget: "string", required: false}
      - {label: "內文", name: "body", widget: "markdown"}

  # 以下 14 個書目頁是 entry collection：一條書目一個檔（content/<section>/*.md），
  # 後台搜尋直接搜到單篇。weight 是排序用，列表頁的「排序」模式拖曳會自動改；
  # 新增的條目 weight 為 0，Hugo 會排在最底下，要調位置就進排序模式拖。
  # index_file 是各頁自己的 _index.md（標題、頁面說明）。
  # sortable_fields 的「檔案」是給家銓盤點用的：照它排序，還沒有 PDF 的條目會排在一起。

  - divider: true

  # ===== 我是啥人 =====
  - name: "bio"
    label: "傳記與年表"
    label_singular: "一筆紀錄"
    folder: "content/bio"
    create: true
    slug: "{{fields.date_text}}-{{slug}}"
    summary: "{{date_text}}　{{title}}"
    reorder: {key: "weight"}
    sortable_fields: ["weight", "date_text", "title", "file"]
    media_folder: "/static/files/bio"
    public_folder: "/files/bio"
    index_file:
      fields:
        - {label: "標題", name: "title", widget: "string"}
        - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
        - {label: "頁面說明（給搜尋引擎看，可不改）", name: "description", widget: "text", required: false}
    fields:
      - {label: "年份／日期", name: "date_text", widget: "string", required: false, hint: "例：2019 或 1993/06"}
      - {label: "標題", name: "title", widget: "string"}
      - {label: "連結（外部網址）", name: "link", widget: "string", required: false, hint: "填了就用這個，底下的檔案會被忽略"}
      - {label: "檔案（上傳 PDF）", name: "file", widget: "file", required: false, hint: "沒有外部連結時才會用到"}
      - {label: "出處", name: "source", widget: "string", required: false}
      - {label: "原始碼（進階，通常留空）", name: "html", widget: "text", required: false, hint: "填了就整條照這段輸出，上面欄位會被忽略。"}
      # 排序用；hidden 欄位不可以有 label（官方 JSON schema 不收），後台也不會顯示
      - {name: "weight", widget: "hidden", default: 0}
  - name: "media"
    label: "受訪與報導"
    label_singular: "一筆受訪"
