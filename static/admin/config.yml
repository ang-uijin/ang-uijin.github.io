backend:
  name: github
  repo: ang-uijin/ang-uijin.github.io
  branch: main
  base_url: https://sveltia-cms-auth.tesiniong.workers.dev

media_folder: "static/images"
public_folder: "/images"

collections:
  # ===== 最新動態：一篇一檔 =====
  - name: "news"
    label: "最新動態"
    label_singular: "動態"
    folder: "content/news"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    media_folder: "/static/files/news"
    public_folder: "/files/news"
    sortable_fields: ["date", "title"]
    fields:
      - {label: "標題", name: "title", widget: "string"}
      - {label: "日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
      - {label: "出處（可不填）", name: "source", widget: "string", required: false}
      - {label: "原始連結（可不填）", name: "link", widget: "string", required: false}
      - {label: "內文", name: "body", widget: "markdown"}

  # ===== 我是啥人 =====
  - name: "aboutme"
    label: "我是啥人"
    files:
      - name: "intro"
        label: "簡介"
        file: "content/aboutme.md"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}
      - name: "bio"
        label: "傳記與年表"
        file: "content/bio/_index.md"
        media_folder: "/static/files/bio"
        public_folder: "/files/bio"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}
      - name: "media"
        label: "受訪與報導"
        file: "content/media/_index.md"
        media_folder: "/static/files/media"
        public_folder: "/files/media"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}
      - name: "preface"
        label: "著作序"
        file: "content/preface/_index.md"
        media_folder: "/static/files/preface"
        public_folder: "/files/preface"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}
      - name: "history"
        label: "參與歷史事件"
        file: "content/history/_index.md"
        media_folder: "/static/files/history"
        public_folder: "/files/history"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}
      - name: "photo"
        label: "寫真館"
        file: "content/photo/_index.md"
        media_folder: "/static/images/photo"
        public_folder: "/images/photo"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}
      - name: "gallery"
        label: "作品集"
        file: "content/gallery/_index.md"
        media_folder: "/static/images/gallery"
        public_folder: "/images/gallery"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}
      - name: "contact"
        label: "聯絡我"
        file: "content/contact_us.md"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}

  # ===== 論文 =====
  - name: "paper"
    label: "論文"
    files:
      - name: "academic"
        label: "學術論文"
        file: "content/paper/_index.md"
        media_folder: "/static/files/paper"
        public_folder: "/files/paper"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}
      - name: "plan"
        label: "研究計畫報告"
        file: "content/plan/_index.md"
        media_folder: "/static/files/plan"
        public_folder: "/files/plan"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}
      - name: "colloquium"
        label: "研討會論文"
        file: "content/colloquium/_index.md"
        media_folder: "/static/files/colloquium"
        public_folder: "/files/colloquium"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}

  # ===== 著書 =====
  - name: "book"
    label: "著書"
    files:
      - name: "books"
        label: "專書"
        file: "content/book/_index.md"
        media_folder: "/static/files/book"
        public_folder: "/files/book"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "頁面說明（給搜尋引擎看，可不改）", name: "description", widget: "text", required: false}
          - label: "書目"
            name: "items"
            widget: "list"
            label_singular: "一筆書目"
            summary: "{{fields.date}}　{{fields.title}}"
            fields:
              - {label: "年份／日期", name: "date", widget: "string", hint: "例：2019 或 1993/06"}
              - {label: "書名／標題", name: "title", widget: "string"}
              - {label: "連結（外部網址）", name: "link", widget: "string", required: false, hint: "填了就用這個，底下的檔案會被忽略"}
              - {label: "檔案（上傳 PDF）", name: "file", widget: "file", required: false, hint: "沒有外部連結時才會用到"}
              - {label: "出處", name: "source", widget: "string", required: false}
      - name: "write"
        label: "編著"
        file: "content/write/_index.md"
        media_folder: "/static/files/write"
        public_folder: "/files/write"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}
      - name: "translate"
        label: "翻譯"
        file: "content/translate/_index.md"
        media_folder: "/static/files/translate"
        public_folder: "/files/translate"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}
      - name: "publish"
        label: "治言齋書肆"
        file: "content/publish/_index.md"
        media_folder: "/static/files/publish"
        public_folder: "/files/publish"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}

  # ===== 其他 =====
  - name: "other"
    label: "其他"
    files:
      - name: "essay"
        label: "雜文"
        file: "content/essay/_index.md"
        media_folder: "/static/files/essay"
        public_folder: "/files/essay"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}
      - name: "commentary"
        label: "評論"
        file: "content/commentary/_index.md"
        media_folder: "/static/files/commentary"
        public_folder: "/files/commentary"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}
      - name: "lecture"
        label: "演講"
        file: "content/lecture/_index.md"
        media_folder: "/static/files/lecture"
        public_folder: "/files/lecture"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}
      - name: "study"
        label: "研究網站"
        file: "content/study/_index.md"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}
      - name: "teach"
        label: "教學網站"
        file: "content/teach/_index.md"
        media_folder: "/static/files/teach"
        public_folder: "/files/teach"
        fields:
          - {label: "標題", name: "title", widget: "string"}
          - {label: "更新日期", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
          - {label: "內容", name: "body", widget: "markdown"}
