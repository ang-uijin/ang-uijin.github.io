{{ define "main" }}
<link rel="stylesheet" href="/pagefind/pagefind-ui.css">
<main class="main-content">
  <article class="content-section search-page">
    <h1>{{ .Title }}</h1>
    <div id="search"></div>
    <div class="search-suggest">
      <span class="search-suggest-label">推薦搜尋</span>
      <button type="button" data-q="地理語言學">地理語言學</button>
      <button type="button" data-q="社會語言學">社會語言學</button>
      <button type="button" data-q="共時方言學">共時方言學</button>
      <button type="button" data-q="歷史語言學">歷史語言學</button>
      <button type="button" data-q="文化語言學">文化語言學</button>
      <button type="button" data-q="文獻研究">文獻研究</button>
      <button type="button" data-q="文字研究">文字研究</button>
    </div>
  </article>
</main>
<script src="/pagefind/pagefind-ui.js"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var ui = new PagefindUI({
      element: '#search',
      showSubResults: true,
      showImages: false,
      excerptLength: 40,
      translations: {
        placeholder: '輸入關鍵字',
        clear_search: '清除',
        load_more: '載入更多',
        search_label: '搜尋本站',
        filters_label: '篩選',
        zero_results: '找不到「[SEARCH_TERM]」',
        many_results: '找到 [COUNT] 筆「[SEARCH_TERM]」的結果',
        one_result: '找到 [COUNT] 筆「[SEARCH_TERM]」的結果',
        alt_search: '找不到「[SEARCH_TERM]」，改顯示「[DIFFERENT_TERM]」的結果',
        search_suggestion: '找不到「[SEARCH_TERM]」，試試其他關鍵字：',
        searching: '搜尋「[SEARCH_TERM]」中…'
      }
    });
    var q = new URLSearchParams(location.search).get('q');
    if (q) ui.triggerSearch(q);
    document.querySelectorAll('.search-suggest button').forEach(function (b) {
      b.addEventListener('click', function () { ui.triggerSearch(b.dataset.q); });
    });
  });
</script>
{{ end }}
