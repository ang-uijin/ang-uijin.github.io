baseURL = 'https://uijin.idv.tw/'
languageCode = 'zh-tw'
title = '治言齋'
defaultContentLanguage = 'zh-tw'
hasCJKLanguage = true
enableRobotsTXT = true
timeZone = 'Asia/Taipei'
# 這個站沒有用 tags／categories 分類（書目的「分類」是 front matter 的 category 字串，不是 taxonomy），
# 不關掉的話 Hugo 會多產生空的 /categories/ 與 /tags/ 兩頁、還進 sitemap。
disableKinds = ['taxonomy', 'term']

[params]
  description = '臺灣語言學者洪惟仁教授的個人網站「治言齋」，收錄學術論文、專書、雜文、影音與教學資料，研究領域為閩南語音韻學、地理語言學與社會語言學。'
  author = '洪惟仁 Ang Uijin'
  copyright = '洪惟仁 版權所有©2026 Uijin Ang All Rights Reserved.'

# 書目條目（content/<section>/*.md）只用來組列表頁，本身不產生網頁、不進 sitemap，
# 也不進 site.RegularPages（只留在各自 section 的 .RegularPages 裡）。
# 放這裡而不放 _index.md 的 cascade，是因為後台存檔會重寫 _index.md。
[[cascade]]
  [cascade.build]
    render = 'never'
    list = 'local'
  [cascade.target]
    kind = 'page'
    path = '{/bio,/book,/colloquium,/commentary,/essay,/history,/lecture,/links,/media,/paper,/plan,/preface,/sites,/translate,/write}/**'

# 首頁多出一份 index.json 給站內搜尋用；section 頁一律不出 RSS
# （否則沒有網址的書目條目會被當成文章列出來）。
[outputs]
  home = ['html', 'rss', 'json']
  section = ['html']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      # 書目的頁碼常寫成 43~80，Goldmark 會把一對 ~ 當成刪除線語法。
      # 這個站用不到刪除線，直接關掉，~ 就永遠是普通字元。
      strikethrough = false
  [markup.highlight]
    style = 'monokai'

# 選單不在這裡設：頂端選單、首頁、次選單、總目錄都讀 data/nav.yaml。
