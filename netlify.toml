[build]
  publish = "public"
  command = "hugo --gc --minify && npx -y pagefind@1.5.2 --site public"

[context.production.environment]
  HUGO_VERSION = "0.154.2"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

[context.deploy-preview]
  command = "hugo -b $DEPLOY_PRIME_URL && npx -y pagefind@1.5.2 --site public"

[context.branch-deploy]
  command = "hugo -b $DEPLOY_PRIME_URL && npx -y pagefind@1.5.2 --site public"
