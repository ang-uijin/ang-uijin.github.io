# 全站選單。頂端選單（partials/navbar.html）、首頁七列（index.html）、
# 各頁上方的次選單（partials/section-nav.html）、總目錄（_default/toc.html）都讀這個檔。
#
#   main      第一層；每一項都有 url（該區第一頁）。
#   children  一區有好幾頁時列出各頁：頂端選單的下拉與次選單用。
#   sub       沒有 children 的區，次目錄由頁面內容自動產生（總目錄用）：
#               cats   頁內的分類小標題（條目的 category）
#               sites  「網站」頁有截圖的各站（short_title、link）
#               tabs   「講義」頁的各門課（content/teach/_index.md 的頁籤）
#   also      也算在這一區的網址（選單亮燈用）。
#   util      右上角的工具連結。
main:
  - name: 我是啥人
    en: About Me
    url: /aboutme/
    children:
      - { name: 簡介, url: /aboutme/ }
      - { name: 傳記與年表, url: /bio/ }
      - { name: 訪問與報導, url: /media/ }
      - { name: 著作序, url: /preface/ }
      - { name: 參與歷史事件, url: /history/ }
      - { name: 寫真館, url: /photo/ }
      - { name: 作品集, url: /gallery/ }
      - { name: 花思木, url: "https://www.facebook.com/uijin.ang", external: true }
      - { name: 聯絡我, url: /contact_us/ }
  - name: 論文
    en: Articles
    url: /paper/
    children:
      - { name: 學術論文, url: /paper/ }
      - { name: 研究計畫報告, url: /plan/ }
      - { name: 研討會論文, url: /colloquium/ }
  - name: 著書
    en: Books
    url: /book/
    children:
      - { name: 專書, url: /book/ }
      - { name: 編著, url: /write/ }
      - { name: 翻譯, url: /translate/ }
      - { name: 治言齋書肆, url: /publish/ }
  - name: 雜文
    en: Essays
    url: /essay/
    children:
      - { name: 雜文, url: /essay/ }
      - { name: 評論, url: /commentary/ }
  - name: 講壇
    en: Talks
    url: /lecture/
    sub: cats
    also: [/podcast/]
  - name: 網站
    en: Websites
    url: /sites/
    sub: sites
  - name: 講義
    en: Course Notes
    url: /teach/
    sub: tabs
util:
  - name: 最新動態
    url: /news/
  - name: 相關連結
    url: /links/
    sub: cats
